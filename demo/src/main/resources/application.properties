spring.application.name=demo

# Banco de dados. Credenciais vem de variaveis de ambiente; NAO ha valor padrao para a senha.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bdAutoCenterSilva}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Numero do WhatsApp da borracharia
whatsapp.numero-borracharia=${WHATSAPP_NUMERO:5545999977015}

# JWT. O segredo (minimo 32 bytes) vem do ambiente e NAO tem valor padrao. Expiracao em ms (padrao 24h).
api.security.token.secret=${JWT_SECRET}
api.security.token.expiration=${JWT_EXPIRATION_MS:86400000}

# CORS: origens permitidas separadas por virgula (somente necessario em desenvolvimento)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# API de cotacao (Feign): evita requisicoes penduradas se o servico externo cair
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# Swagger desligado por padrao (habilite com SWAGGER_ENABLED=true somente em desenvolvimento)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Logs: saem no console. No servidor, consulte com: journalctl -u <servico> -f
logging.level.root=INFO
logging.level.com.autoCenterSilva=INFO
logging.level.org.springframework=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
